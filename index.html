<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141414">
<meta name="description" content="NotenFlow – Noten lesen üben mit Klaviertastatur, Liedern und Akkorden.">
<title>NotenFlow</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23d6a24a'/%3E%3Cellipse cx='26' cy='38' rx='8' ry='6' transform='rotate(-22 26 38)' fill='%231b1407'/%3E%3Cpath d='M33 36V14' stroke='%231b1407' stroke-width='3.2' stroke-linecap='round'/%3E%3C/svg%3E">
<script>
/* Theme vor dem ersten Zeichnen setzen (kein Aufblitzen) */
(function(){var t='dark';try{var s=localStorage.getItem('notenflow:theme')||'auto';t=s==='auto'?(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):s;if(localStorage.getItem('notenflow:bg')==='off')document.documentElement.setAttribute('data-bg','off')}catch(e){}document.documentElement.setAttribute('data-theme',t)})();
</script>
<style>
:root{
  --bg:#141414;--surface:#1b1b1b;--surface2:#242424;--line:#2c2c2b;--line2:#3d3d3b;
  --ink:#ebe8e1;--muted:#98948b;--faint:#6b6860;
  --accent:#d6a24a;--accent-ink:#1b1407;--accent-soft:rgba(214,162,74,.13);
  --ok:#62b98c;--bad:#e2675f;
  --stf:rgba(235,232,225,.42);--bgink:235,232,225;
  --shadow:0 12px 30px -20px rgba(0,0,0,.85);
  --radius:14px;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:ui-serif,"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
:root[data-theme=light]{
  --bg:#f4f1ea;--surface:#fffdf8;--surface2:#eeeae1;--line:#e1dccf;--line2:#cbc4b3;
  --ink:#1e1d1a;--muted:#6c675d;--faint:#9a9486;
  --accent:#a8701a;--accent-ink:#fffaf0;--accent-soft:rgba(168,112,26,.11);
  --ok:#2e8a5a;--bad:#c4443c;
  --stf:rgba(30,29,26,.5);--bgink:30,29,26;
  --shadow:0 1px 2px rgba(60,50,30,.06),0 14px 30px -22px rgba(60,50,30,.3);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
html.theme-anim *{transition:background-color .35s,color .35s,border-color .35s,fill .35s,stroke .35s!important}
body{min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);font:500 15.5px/1.55 var(--sans);overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
svg.ic{flex:none;display:block}
h1,h2,h3{line-height:1.2;letter-spacing:-.01em}
.wrap{width:min(1080px,100%);margin:0 auto;padding:0 18px}
.spacer{flex:1}

/* Hintergrund: ziehende Notenzeilen */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 30%,transparent 30%,var(--bg) 100%)}
.bg .track{position:absolute;left:0;display:flex;width:max-content;will-change:transform;animation:drift var(--dur,120s) linear infinite}
.bg .track.rev{animation-direction:reverse}
.bg svg{flex:none;display:block;color:rgb(var(--bgink));opacity:.09}
@keyframes drift{to{transform:translateX(-2400px)}}
html[data-bg=off] .bg .track{animation:none}

/* Kopfzeile & Navigation */
.topbar{position:sticky;top:0;z-index:30;padding:calc(env(safe-area-inset-top) + 8px) 0 8px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:700;font-size:1.2rem;letter-spacing:-.01em;transition:opacity .2s}
.brand:hover{opacity:.8}
.logo{width:32px;height:32px;display:block;transition:transform .5s var(--ease)}
.brand:hover .logo{transform:rotate(-8deg) scale(1.06)}
.nav{position:relative;display:flex;gap:2px;padding:3px;margin-left:10px}
.nav button{position:relative;z-index:1;display:flex;align-items:center;gap:8px;padding:7px 13px;border-radius:10px;color:var(--muted);font-weight:600;font-size:.93rem;transition:color .2s,transform .2s var(--ease)}
.nav button:hover{color:var(--ink);transform:translateY(-1px)}
.nav button[aria-current=page]{color:var(--ink)}
.nav button[aria-current=page] .ni{color:var(--accent)}
.nav .ni{display:flex;transition:transform .3s var(--ease)}
.nav button:hover .ni{transform:scale(1.15) rotate(-6deg)}
.nav-ind{position:absolute;left:0;top:0;z-index:0;border-radius:10px;background:var(--surface2);border:1px solid var(--line);width:var(--iw,0);height:var(--ih,0);transform:translate(var(--ix,0),var(--iy,0));transition:transform .45s cubic-bezier(.3,1.25,.4,1),width .45s cubic-bezier(.3,1.25,.4,1),height .3s}
.tools{margin-left:auto;display:flex;align-items:center;gap:8px}
.lvl{display:flex;align-items:center;gap:9px;padding:4px 12px 4px 4px;border-radius:999px;border:1px solid var(--line);background:var(--surface);transition:border-color .2s,transform .2s var(--ease)}
.lvl:hover{border-color:var(--accent);transform:translateY(-1px)}
.lvl b{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:.82rem}
.lvl-meta{display:flex;flex-direction:column;gap:3px;text-align:left}
.lvl .bar,.xpline{height:4px;border-radius:9px;background:var(--line);overflow:hidden;display:block;width:70px}
.lvl .bar i,.xpline i{display:block;height:100%;background:var(--accent);width:0;border-radius:9px;transition:width .7s var(--ease)}
.lvl small{color:var(--muted);font-size:.68rem;line-height:1;font-weight:600}
.icon-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted);border:1px solid var(--line);background:var(--surface);transition:color .2s,border-color .2s,transform .25s var(--ease)}
.icon-btn:hover{color:var(--ink);border-color:var(--line2);transform:translateY(-1px)}
.icon-btn:active{transform:scale(.92)}
#btn-theme svg{transition:transform .5s var(--ease)}
#btn-theme:hover svg{transform:rotate(40deg)}
.avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--accent);display:grid;place-items:center;font-weight:800;color:var(--accent-ink);border:1px solid var(--line2)}
.avatar.lg{width:64px;height:64px;font-size:1.6rem}
#auth button.av{display:block;border-radius:50%;transition:transform .25s var(--ease)}
#auth button.av:hover{transform:scale(1.07)}

/* Buttons & Formularelemente */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-weight:650;font-size:.95rem;white-space:nowrap;transition:background .2s,border-color .2s,transform .2s var(--ease),filter .2s}
.btn:hover{border-color:var(--line2);transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.lg{padding:13px 26px;font-size:1.02rem}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface2)}
.btn.google{background:#fff;color:#1f1f1f;border-color:#dadce0}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent);background:transparent}
.btn.sm{padding:7px 12px;font-size:.88rem}
.btn svg.ic{width:18px;height:18px}
.card,.glass{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card{padding:20px}
.field{margin-bottom:22px}
.field:last-child{margin-bottom:0}
.field label,.field .lb,.lb{display:block;font-weight:700;margin-bottom:9px;font-size:.93rem}
.hint-txt{color:var(--muted);font-size:.86rem;margin-top:8px}
.seg{display:inline-flex;flex-wrap:wrap;gap:3px;padding:3px;background:var(--surface2);border:1px solid var(--line);border-radius:11px}
.seg button{padding:7px 13px;border-radius:8px;font-weight:650;font-size:.9rem;color:var(--muted);transition:color .2s,background .2s,transform .2s var(--ease);display:inline-flex;align-items:center;gap:7px}
.seg button:hover{color:var(--ink)}
.seg button:active{transform:scale(.95)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.25),0 0 0 1px var(--line2)}
.seg button.locked{opacity:.5}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 13px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-weight:650;font-size:.9rem;text-align:center;line-height:1.25;transition:border-color .2s,background .2s,transform .2s var(--ease)}
.chip:hover{border-color:var(--line2);transform:translateY(-1px)}
.chip small{display:block;font-size:.68rem;color:var(--muted);font-weight:600}
.chip[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.chip.locked{opacity:.55;border-style:dashed}
.lk{display:inline-flex;vertical-align:-2px;margin-right:4px;color:var(--faint)}
.switch{display:flex;align-items:center;gap:12px;width:100%;padding:8px 0;text-align:left;font-weight:600}
.switch i{width:40px;height:23px;border-radius:99px;background:var(--line2);position:relative;transition:.25s;flex:none}
.switch i::after{content:"";position:absolute;left:3px;top:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:transform .25s var(--ease)}
.switch[aria-checked=true] i{background:var(--accent)}
.switch[aria-checked=true] i::after{transform:translateX(17px)}
input[type=range]{width:100%;accent-color:var(--accent);height:24px;cursor:pointer}
.range-row{display:flex;align-items:center;gap:12px}
.range-row output{min-width:3.2em;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:.88rem}
.sect{margin:30px 0 12px;font-size:.74rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:800}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);font-size:.72rem;font-weight:700;color:var(--muted)}
.notice{padding:12px 14px;border-radius:10px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);font-size:.9rem}
kbd{padding:1px 7px;border-radius:6px;background:var(--surface2);border:1px solid var(--line2);font:700 .78rem ui-monospace,monospace}

/* Ansichten */
main{padding:26px 0 70px}
.view{display:none}
.view.active{display:block;animation:viewIn .45s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.page-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.page-head h2{font-family:var(--serif);font-size:1.7rem;font-weight:600}
.page-head .sub{color:var(--muted);font-size:.9rem}
.greet{padding:6px 0 4px}
.eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.14em;color:var(--accent);font-weight:800}
.greet h1{font-family:var(--serif);font-size:clamp(1.9rem,4.6vw,2.9rem);font-weight:600;margin:4px 0 6px}
.quote{color:var(--muted);font-family:var(--serif);font-style:italic;font-size:1.08rem;max-width:60ch;min-height:1.6em}
.xpline.wide{width:min(360px,100%);height:5px;margin-top:16px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:14px}
.mode{padding:20px;text-align:left;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden;transition:transform .35s var(--ease),border-color .25s,box-shadow .35s}
.mode:hover{transform:translateY(-4px);border-color:var(--accent)}
.mode .mi{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);transition:transform .4s var(--ease),background .25s,color .25s}
.mode:hover .mi{transform:scale(1.08) rotate(-5deg);background:var(--accent);color:var(--accent-ink)}
.mode h3{font-family:var(--serif);font-size:1.22rem;font-weight:600;margin-top:4px}
.mode p{color:var(--muted);font-size:.9rem;flex:1}
.mode .st{font-size:.8rem;font-weight:700;color:var(--muted);display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.mode .go{display:inline-flex;color:var(--accent);opacity:0;transform:translateX(-8px);transition:.3s var(--ease)}
.mode:hover .go{opacity:1;transform:none}
.mode.locked{opacity:.62}
.mode.locked:hover{border-color:var(--line2);transform:none}
.mode.locked .mi{background:var(--surface2);color:var(--faint)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.setup{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;align-items:start}
.setup .side{position:sticky;top:84px}
.preview{margin-top:14px;padding:6px 10px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}

/* Notensystem */
.stf-svg{display:block;margin:0 auto;width:100%;height:auto}
.stf{stroke:var(--stf);stroke-width:1.4}
.ledger{stroke:var(--stf);stroke-width:1.7;stroke-linecap:round}
.barline{stroke:var(--stf);stroke-width:1.5}
.barline.thick{stroke-width:4.5}
.clef{color:var(--ink)}
.clef path{fill:none;stroke:currentColor;stroke-width:.27;stroke-linecap:round;stroke-linejoin:round}
.clef circle{fill:currentColor}
.clef-ic{width:16px;height:22px}
.acc{color:var(--ink)}
.acc path{fill:none;stroke:currentColor;stroke-linecap:round}
.head{fill:var(--c)}
.head.hollow{fill:var(--surface);stroke:var(--c);stroke-width:2.4}
.head.idle{--c:var(--ink)}
.head.active{--c:var(--accent)}
.head.correct{--c:var(--ok)}
.head.wrong{--c:var(--bad)}
.stem{stroke-width:1.7;stroke-linecap:round}
.stem.idle{stroke:var(--ink)}.stem.active{stroke:var(--accent)}.stem.correct{stroke:var(--ok)}
.band{fill:var(--accent-soft);stroke:none}
.hint{fill:var(--muted);font:700 12px var(--sans)}
.clabel{fill:var(--accent);font:800 12px var(--sans)}
.fx-pop{animation:ntpop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes ntpop{40%{transform:scale(1.3)}}
.fx-shake{animation:ntshake .42s}
@keyframes ntshake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

/* Spielansicht */
.hud{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.hud-title{font-family:var(--serif);font-weight:600;font-size:1.15rem;flex:1;text-align:center}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.stat .k{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800}
.stat .v{font-size:1.45rem;font-weight:800;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.stat .v svg{color:var(--accent)}
.stat .v.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.25)}}
.stage{padding:14px 14px 34px;margin-top:12px;position:relative}
.stage-top{display:flex;justify-content:space-between;gap:10px;font-size:.84rem;color:var(--muted);font-weight:650;min-height:22px;padding:0 6px}
.stage-top b{color:var(--accent)}
.timer{height:4px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 6px 0}
.timer i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left}
.timer i.low{background:var(--bad)}
.feedback{min-height:28px;text-align:center;font-weight:700;margin-top:10px}
.feedback.ok{color:var(--ok)}.feedback.bad{color:var(--bad)}
.feedback.pop{animation:fpop .35s}
@keyframes fpop{from{opacity:0;transform:translateY(6px)}}
.played{position:absolute;right:16px;bottom:10px;display:flex;align-items:center;gap:6px;font-size:.78rem;font-weight:650;color:var(--muted);opacity:0;transform:translateY(4px);transition:opacity .25s,transform .25s;pointer-events:none}
.played.show{opacity:.95;transform:none}
.played b{font-size:.9rem}
.played.ok b{color:var(--ok)}.played.bad b{color:var(--bad)}
.xpf{position:absolute;left:50%;top:40%;font-weight:800;color:var(--accent);pointer-events:none;animation:xpf .9s forwards}
@keyframes xpf{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-46px)}}
.piano{margin-top:14px;padding:8px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.keys{position:relative;height:clamp(130px,24vh,200px);display:flex;gap:3px}
.wk{flex:1;position:relative;border-radius:0 0 9px 9px;background:linear-gradient(#fcfbf7,#e4e0d4);color:#2a2823;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;font-weight:700;font-size:.92rem;box-shadow:0 4px 0 #b3ad9d;transition:transform .08s,background .15s}
.wk:active,.wk.down{transform:translateY(3px);box-shadow:0 1px 0 #b3ad9d}
.bk{position:absolute;top:0;width:7.6%;height:60%;transform:translateX(-50%);z-index:2;border-radius:0 0 7px 7px;background:linear-gradient(#3a3832,#121110);color:#b9b4a8;font-size:.6rem;font-weight:700;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;box-shadow:0 4px 0 #000;transition:transform .08s}
.bk:active{transform:translateX(-50%) translateY(3px)}
.wk.ok,.bk.ok{background:var(--ok);color:#06241a}
.wk.bad,.bk.bad{background:var(--bad);color:#2a0805}
.wk.hint,.bk.hint{background:var(--accent);color:var(--accent-ink)}
.kbd-hint{text-align:center;color:var(--muted);font-size:.8rem;margin-top:12px}
.overlay{position:absolute;inset:0;border-radius:var(--radius);background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(6px);display:grid;place-items:center;text-align:center;z-index:5;gap:12px;align-content:center}
.overlay[hidden]{display:none}
.overlay h2{font-family:var(--serif);font-weight:600}

/* Dialoge, Toasts */
.modal-bd{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:50;padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{width:min(520px,100%);max-height:90dvh;overflow:auto;padding:24px;background:var(--surface);animation:viewIn .3s var(--ease)}
.modal.wide{width:min(720px,100%)}
.modal h2{font-family:var(--serif);font-size:1.5rem;font-weight:600;margin-bottom:6px}
.modal .sub{color:var(--muted);margin-bottom:16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:14px}
.tile{padding:13px;border-radius:12px;background:var(--surface2);border:1px solid var(--line)}
.tile .k{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800}
.tile .v{font-size:1.45rem;font-weight:800;font-variant-numeric:tabular-nums}
.rec{margin-top:14px;padding:11px 14px;border-radius:10px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);font-weight:700;display:flex;gap:10px;align-items:center}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);text-align:left;width:100%;transition:border-color .2s,transform .2s var(--ease),background .2s}
button.li:hover{border-color:var(--accent);transform:translateX(3px)}
.li[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.li.locked{opacity:.55}
.li .grow{flex:1;min-width:0}
.li b{display:block}
.li small{color:var(--muted)}
.stars{color:var(--accent);letter-spacing:2px;font-size:.9rem}
.stars .off{color:var(--line2)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--faint);margin-right:8px}
.dot.synced{background:var(--ok)}.dot.syncing,.dot.pending{background:var(--accent)}.dot.error{background:var(--bad)}
#toasts{position:fixed;right:16px;top:calc(env(safe-area-inset-top) + 66px);display:flex;flex-direction:column;gap:10px;z-index:60;pointer-events:none;width:min(330px,calc(100vw - 32px))}
.toast{display:flex;gap:12px;align-items:center;padding:11px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line2);border-left:3px solid var(--accent);box-shadow:0 14px 34px -14px rgba(0,0,0,.6);animation:toastIn .5s cubic-bezier(.2,1.2,.3,1)}
.toast.out{opacity:0;transform:translateX(30px);transition:.4s}
.toast .t-ic{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent);flex:none}
.toast b{display:block;font-size:.95rem}.toast span{color:var(--muted);font-size:.84rem;line-height:1.3;display:block}
@keyframes toastIn{from{opacity:0;transform:translateX(50px) scale(.95)}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}

/* Profil, Erfolge */
.prof-head{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.prof-head h2{font-family:var(--serif);font-size:1.6rem;font-weight:600}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.ach{padding:14px;display:flex;gap:12px;align-items:center;border-radius:12px;background:var(--surface);border:1px solid var(--line);transition:transform .25s var(--ease),border-color .2s}
.ach:hover{transform:translateY(-2px);border-color:var(--line2)}
.ach .ai{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.ach.locked{border-style:dashed;background:transparent}
.ach.locked .ai{background:var(--surface2);color:var(--faint)}
.ach b{display:block;font-size:.93rem}.ach small{color:var(--muted);line-height:1.3;display:block}
.ach .when{color:var(--faint);font-size:.74rem;margin-top:2px}

/* Statistik */
.dash{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.s4{grid-column:span 4}.s6{grid-column:span 6}.s8{grid-column:span 8}.s12{grid-column:span 12}
.panel{padding:18px;min-width:0}
.panel h3{font-size:.95rem;font-weight:700}
.panel .sub{color:var(--muted);font-size:.82rem;margin:2px 0 12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{padding:14px 16px}
.kpi .k{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800}
.kpi .v{font-family:var(--serif);font-size:1.9rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .d{font-size:.78rem;color:var(--muted)}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font:600 11px var(--sans)}
.chart .big{fill:var(--ink);font:600 26px var(--serif)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{stroke:var(--line2);stroke-width:1}
.chart .f-a{fill:var(--accent)}.chart .f-ok{fill:var(--ok)}.chart .f-bad{fill:var(--bad)}.chart .f-m{fill:var(--line2)}
.chart .l-a{stroke:var(--accent);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.chart .area{fill:var(--accent-soft)}
.chart .hit{transition:opacity .2s}
.chart .hit:hover{opacity:.7}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.empty{color:var(--muted);text-align:center;padding:26px 10px;font-size:.9rem}

/* Lernen / Doku */
.doc{display:grid;grid-template-columns:190px 1fr;gap:30px}
.toc{position:sticky;top:84px;align-self:start;display:flex;flex-direction:column;gap:2px}
.toc a{padding:6px 12px;border-left:2px solid var(--line);color:var(--muted);font-size:.9rem;font-weight:600;transition:color .2s,border-color .2s,padding .2s}
.toc a:hover{color:var(--ink);border-color:var(--accent);padding-left:16px}
.doc-sec{margin-bottom:40px;scroll-margin-top:84px}
.doc-sec h2{font-family:var(--serif);font-size:1.6rem;font-weight:600;margin-bottom:8px}
.doc-sec p{color:var(--muted);margin:8px 0;max-width:68ch}
.doc-sec p b{color:var(--ink)}
.fig{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;margin:14px 0;max-width:640px}
.fig figcaption{color:var(--muted);font-size:.84rem;text-align:center;margin-top:6px}
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 10px 10px 0;margin:12px 0;max-width:68ch;font-size:.93rem}
.mini-piano .keys{height:110px}
.mini-piano .wk{font-size:.8rem}

/* Responsiv */
@media (max-width:860px){
  .nav{position:fixed;left:0;right:0;bottom:0;margin:0;padding:0 0 env(safe-area-inset-bottom);z-index:40;background:var(--surface);border-top:1px solid var(--line);justify-content:space-around}
  .nav button{flex:1;flex-direction:column;gap:2px;padding:9px 4px 7px;font-size:.68rem;border-radius:0}
  .nav button:hover{transform:none}
  .nav-ind{top:0;height:3px;width:var(--iw,0);border:0;border-radius:0 0 3px 3px;background:var(--accent);transform:translateX(var(--ix,0))}
  main{padding-bottom:96px}
  .brand-name{display:none}
  .doc{grid-template-columns:1fr}
  .toc{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:6px}
  .toc a{border:1px solid var(--line);border-radius:99px;white-space:nowrap;padding:5px 12px}
  .toc a:hover{padding-left:12px}
}
@media (max-width:760px){
  .cols,.setup{grid-template-columns:1fr}
  .setup .side{position:static}
  .stats{grid-template-columns:repeat(2,1fr)}
  .lvl .bar,.lvl small{display:none}
  .lvl-meta{display:none}.lvl{padding:4px}
  #toasts{left:50%;right:auto;transform:translateX(-50%)}
  .keys{height:clamp(120px,22vh,170px)}
  .wk{font-size:.78rem}
  .s4,.s6,.s8{grid-column:span 12}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}

/* Ergänzungen */
:root{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500}
:root[data-theme=light]{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100}

.chart .f-s1{fill:var(--s1)}.chart .f-s2{fill:var(--s2)}.chart .f-s3{fill:var(--s3)}.chart .f-s4{fill:var(--s4)}
.chart .col{fill:transparent;cursor:default}
.chart .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .ref{stroke:var(--ink);stroke-width:1.2;stroke-dasharray:4 4;opacity:.6}
.chart .rg{fill:none;stroke-width:16}.chart .rg-ok{stroke:var(--ok)}.chart .rg-bad{stroke:var(--bad)}
.chart .hm{fill:var(--accent);stroke:var(--line2);stroke-width:1}
.tip{position:fixed;left:0;top:0;z-index:80;pointer-events:none;background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:6px 10px;font-size:.8rem;font-weight:600;box-shadow:0 8px 24px -10px rgba(0,0,0,.6);opacity:0;transition:opacity .15s;max-width:260px}
.tip.on{opacity:1}
details.tbl{margin-top:10px;font-size:.85rem;color:var(--muted)}
details.tbl summary{cursor:pointer;font-weight:650}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em}
.finder-figs{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:640px}

      const [app, au, fs] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
      const a = app.initializeApp(firebaseConfig);

      console.error('Firebase konnte nicht geladen werden', e);

      renderAuth();

  setStatus(s) { this.status = s; const el = $('#sync-state'); if (el) el.innerHTML = syncHTML(); },
  async onUser(u) {
    if (u) {

  async pull(u) {
    const ref = this.F.doc(this.db, 'users', u.uid), snap = await this.F.getDoc(ref);

    let m = fill(DEFAULTS(), cloud);
    if (hasProgress(cache)) m = mergeData(m, cache);

    S = m; writeLocal('uid:' + u.uid, S);
    await this.push();
  },
  async push() {
    if (!this.user) return;
    try {
      this.setStatus('syncing');
      await this.F.setDoc(this.F.doc(this.db, 'users', this.user.uid), { data: JSON.parse(JSON.stringify(S)), name: this.user.displayName || '', updatedAt: this.F.serverTimestamp() });

const G_CLEF = '<path d="M-.6 2.3C-.55 3.2 .7 3.3 .6 2.2L.15-3.2C.05-4.3 .95-4.6 1.15-3.6C1.3-2.6 .2-1.6-.6-.9C-1.5-.1-1.3 1.1-.1 1.35C1.2 1.5 1.6 .1 .9-.6C.3-1.1-.6-.7-.6 0C-.6 .6 .3 .7 .45 .15"/><circle cx="-.6" cy="2.3" r=".26"/>';

  ? `<svg class="clef-ic" viewBox="-1.4 -1.6 4 5.2" aria-hidden="true"><g class="clef">${F_CLEF}</g></svg>`

function staffSVG(o) {
  const b = CLEF[o.clef].bottom, top = b + 8, mid = b + 4, half = GAP / 2;
  const items = o.items || [];
  const minS = Math.min(b, o.range[0]), maxS = Math.max(top, o.range[1]);
  const padT = Math.max(36, (maxS - top) * half + 34);
  const padB = Math.max(50, (b - minS) * half + 38) + (o.hints ? 16 : 0);
  const yB = padT + 4 * GAP, H = Math.round(yB + padB);
  const Y = st => yB - (st - b) * half;
  const key = KEY(o.keyId), sig = key.n ? SIG[o.clef][key.t].slice(0, key.n) : [];
  const sigX = 66, sigD = 17, first = sigX + sig.length * sigD + (sig.length ? 8 : 0) + 26;
  const hw = GAP * .62;
  const base = items.map(it => (it.notes.length > 1 || it.chordItem) ? 64 : ({ 1: 58, 2: 74, 4: 92 }[it.dur || 1] || 58));

  out += o.clef === 'bass'
    ? `<g class="clef" transform="translate(30 ${Y(24)}) scale(${GAP})">${F_CLEF}</g>`
    : `<g class="clef" transform="translate(36 ${Y(32)}) scale(${GAP})">${G_CLEF}</g>`;
  sig.forEach((st, i) => { out += accG(key.t, sigX + i * sigD + 6, Y(st)); });

    const down = (lo + hi) / 2 >= mid, dur = it.dur || 1;

    const lg = new Set();

  });
  if (items.length) {
    if (o.finalBar) out += `<line class="barline" x1="${W - 16}" x2="${W - 16}" y1="${yB - 4 * GAP}" y2="${yB}"/><line class="barline thick" x1="${W - 10}" x2="${W - 10}" y1="${yB - 4 * GAP}" y2="${yB}"/>`;

  }
  return { svg: `<svg class="stf-svg" viewBox="0 0 ${W} ${H}" style="max-width:${Math.round(W * 1.5)}px" role="img" aria-label="Notensystem">${out}</svg>`, W, H };
}

    S.settings.modes[m][k] = ['diff', 'limit', 'perLine', 'dur', 'level'].includes(k) ? Number(raw) : raw; save(); renderSetup(); return;
  }
  const sw = e.target.closest('[data-sw]'); if (sw) { const [m, k] = sw.dataset.sw.split('.'); S.settings.modes[m][k] = !S.settings.modes[m][k]; save(); renderSetup(); return; }
  const sg = e.target.closest('[data-song]');
  if (sg && !sg.disabled) { const s = SONGS.find(x => x.id === sg.dataset.song); if (s) startGame('songs', { song: s, level: S.settings.modes.songs.level }); }
});

/* ---------------------------------------------------------------
   Lernen: Grundwissen zum Notenlesen (fürs Klavier)
   --------------------------------------------------------------- */
const N = (step, acc = 0) => ({ step, acc });
function fig(clef, keyId, items, caption, minW = 420) {
  const steps = items.flatMap(i => i.notes.map(n => n.step)), b = CLEF[clef].bottom;
  const range = [Math.min(b, ...(steps.length ? steps : [b])), Math.max(b + 8, ...(steps.length ? steps : [b]))];
  return `<figure class="fig">${staffSVG({ clef, keyId, items, range, minW, naming: S.settings.naming }).svg}<figcaption>${caption}</figcaption></figure>`;
}
function posText(clef, step) {
  const p = step - CLEF[clef].bottom;
  if (p >= 0 && p <= 8) return p % 2 === 0 ? `auf der ${p / 2 + 1}. Linie` : `im ${(p + 1) / 2}. Zwischenraum`;
  if (p < 0) return p % 2 === 0 ? `auf der ${-p / 2}. Hilfslinie unter dem System` : 'direkt unter dem System';
  return p % 2 === 0 ? `auf der ${(p - 8) / 2}. Hilfslinie über dem System` : 'direkt über dem System';
}
function finderOut(i) {
  const L = ['C', 'D', 'E', 'F', 'G', 'A', 'B'][i], name = noteName(N(28 + i), 'C', S.settings.naming), tr = 28 + i, ba = 21 + i;
  Snd.init(); Snd.note(midiOf(N(tr), 'C'), { force: true });
  $('#finder-out').innerHTML = `<p><b style="color:var(--ink);font-size:1.2rem">${name}</b> – so sieht der Ton im Notensystem aus:</p>
    <div class="finder-figs">${fig('treble', 'C', [{ notes: [N(tr)], dur: 1 }], 'Violinschlüssel: ' + posText('treble', tr), 220)}${fig('bass', 'C', [{ notes: [N(ba)], dur: 1 }], 'Bassschlüssel: ' + posText('bass', ba), 220)}</div>`;
  $$('#finder .wk').forEach((k, j) => k.classList.toggle('down', j === i));
}
function renderLearn() {
  if (!S.extra.learn) { S.extra.learn = 1; save(); setTimeout(checkAch, 400); }
  const q = (steps, dur = 1) => steps.map(s => ({ notes: [N(s)], dur }));
  const nm = S.settings.naming, H = nm === 'en' ? 'B' : 'H';
  const secs = [['lines', 'Linien'], ['clefs', 'Schlüssel'], ['names', 'Notennamen'], ['ledger', 'Hilfslinien'], ['values', 'Notenwerte'], ['bars', 'Takt'], ['acc', 'Vorzeichen'], ['scales', 'Tonleitern'], ['chords', 'Akkorde'], ['tips', 'Merkhilfen']];
  const wkeys = ['C', 'D', 'E', 'F', 'G', 'A', H].map((l, i) => `<button class="wk" data-find="${i}" aria-label="${l}">${l}</button>`).join('');
  $('#view-learn').innerHTML = `
    <div class="page-head"><div><h2>Lernen</h2><span class="sub">Das Wichtigste zum Notenlesen am Klavier – kurz und zum Ausprobieren.</span></div></div>
    <div class="doc">
      <nav class="toc" aria-label="Inhalt">${secs.map(([id, l]) => `<a href="#" data-scroll="${id}">${l}</a>`).join('')}</nav>
      <div>
        <section class="doc-sec" id="doc-lines"><h2>Fünf Linien</h2>
          <p>Noten stehen auf einem <b>Notensystem</b> aus <b>fünf Linien</b>. Gezählt wird von unten nach oben. Eine Note kann <b>auf einer Linie</b> sitzen oder <b>im Zwischenraum</b> dazwischen. Je höher die Note, desto höher der Ton – und desto weiter rechts spielst du auf dem Klavier.</p>
          ${fig('treble', 'C', q([30, 32, 34, 36, 38]), 'Fünf Noten – jeweils auf einer Linie, von der 1. bis zur 5. Linie.')}
          ${fig('treble', 'C', q([31, 33, 35, 37]), 'Vier Noten in den vier Zwischenräumen.')}
        </section>
        <section class="doc-sec" id="doc-clefs"><h2>Notenschlüssel</h2>
          <p>Der <b>Schlüssel</b> am Zeilenanfang legt fest, welche Linie welcher Ton ist. Am Klavier brauchst du zwei: Die rechte Hand liest meist im <b>Violinschlüssel</b>, die linke im <b>Bassschlüssel</b>.</p>
          ${fig('treble', 'C', q([32]), 'Violinschlüssel (G-Schlüssel): Er „umkreist“ die 2. Linie – das ist das <b>g′</b> (G über dem mittleren C).')}
          ${fig('bass', 'C', q([24]), 'Bassschlüssel (F-Schlüssel): Die zwei Punkte rahmen die 4. Linie ein – das ist das <b>f</b> (F unter dem mittleren C).')}
        </section>
        <section class="doc-sec" id="doc-names"><h2>Notennamen &amp; Tasten</h2>
          <p>Die weißen Tasten heißen <b>C D E F G A ${H}</b> und wiederholen sich. Probier es aus: Tippe eine Taste an und sieh, wo die Note im System steht.</p>
          <div class="mini-piano glass" id="finder" style="max-width:520px;margin:12px 0"><div class="keys">${wkeys}</div></div>
          <div id="finder-out" class="callout">Tippe eine Taste an …</div>
          <p>${nm === 'de' ? 'Im Deutschen heißt der Ton vor dem C <b>H</b>; das <b>B</b> ist das ♭-erniedrigte H. International heißt unser H einfach B.' : 'Internationally, the note before C is called B.'}</p>
        </section>
        <section class="doc-sec" id="doc-ledger"><h2>Hilfslinien</h2>
          <p>Wird es für das System zu hoch oder zu tief, werden kurze <b>Hilfslinien</b> ergänzt. Das <b>mittlere C</b> (c′) liegt im Violinschlüssel auf einer Hilfslinie unter dem System, im Bassschlüssel auf einer darüber.</p>
          ${fig('treble', 'C', q([28, 26, 40, 42]), 'Violinschlüssel: mittleres C und A darunter, dazu zwei hohe Töne mit Hilfslinien oben.')}
          ${fig('bass', 'C', q([28, 30, 16, 14]), 'Bassschlüssel: mittleres C, E darüber und zwei tiefe Töne mit Hilfslinien unten.')}
        </section>
        <section class="doc-sec" id="doc-values"><h2>Notenwerte</h2>
          <p>Die Form der Note sagt, <b>wie lange</b> sie klingt – gezählt in Schlägen (4/4-Takt):</p>
          ${fig('treble', 'C', [{ notes: [N(32)], dur: 4, label: 'Ganze · 4' }, { notes: [N(32)], dur: 2, label: 'Halbe · 2' }, { notes: [N(32)], dur: 1, label: 'Viertel · 1' }], 'Ganze Note (hohl, ohne Hals) – halbe Note (hohl, mit Hals) – Viertelnote (ausgefüllt).', 460)}
        </section>
        <section class="doc-sec" id="doc-bars"><h2>Takt &amp; Taktstrich</h2>
          <p>Senkrechte <b>Taktstriche</b> teilen die Noten in gleich lange Abschnitte, die <b>Takte</b>. Die Taktart, etwa <b>4/4</b>, steht am Anfang: vier Viertel pro Takt. Am Ende eines Stücks steht ein <b>Doppelstrich</b>.</p>
          ${fig('treble', 'C', [{ notes: [N(28)], dur: 1 }, { notes: [N(29)], dur: 1 }, { notes: [N(30)], dur: 1 }, { notes: [N(31)], dur: 1, barAfter: true }, { notes: [N(32)], dur: 2 }, { notes: [N(32)], dur: 2 }], 'Zwei Takte: vier Viertel (1+1+1+1) und zwei Halbe (2+2).', 480)}
        </section>
        <section class="doc-sec" id="doc-acc"><h2>Vorzeichen</h2>
          <p>Zwischen den weißen Tasten liegen die schwarzen. Ein <b>♯ (Kreuz)</b> erhöht einen Ton um einen Halbton – eine Taste nach rechts. Ein <b>♭ (Be)</b> erniedrigt um einen Halbton, ein <b>♮ (Auflösungszeichen)</b> hebt beides auf. Ein Vorzeichen gilt bis zum Taktende.</p>
          ${fig('treble', 'C', [{ notes: [N(31, 1)], dur: 1, label: 'Fis' }, { notes: [N(34, -1)], dur: 1, label: nm === 'en' ? 'B♭' : 'B' }], 'F♯ (Fis) und B♭ (nach deutscher Schreibweise „B“).', 360)}
          <p>Stehen die Zeichen gleich nach dem Schlüssel, gelten sie für das ganze Stück: die <b>Tonart-Vorzeichen</b>.</p>
          ${fig('treble', 'G', [], 'G-Dur: ein ♯ – alle F werden zu Fis.', 300)}
          ${fig('treble', 'F', [], 'F-Dur: ein ♭ – alle B werden zu B♭.', 300)}
        </section>
        <section class="doc-sec" id="doc-scales"><h2>Tonleitern &amp; Tonarten</h2>
          <p>Eine <b>Dur-Tonleiter</b> besteht aus acht Tönen. Zwischen 3. und 4. sowie 7. und 8. Ton liegt nur ein Halbton, sonst ein Ganzton. Die <b>Tonart</b> sagt, welche Vorzeichen dafür nötig sind. C-Dur kommt ganz ohne aus, nur weiße Tasten.</p>
          ${fig('treble', 'C', q([28, 29, 30, 31, 32, 33, 34, 35]), 'C-Dur: nur weiße Tasten.', 520)}
          ${fig('treble', 'G', q([32, 33, 34, 35, 36, 37, 38, 39]), 'G-Dur: Das Fis steht im Vorzeichen und gilt für jedes F.', 520)}
        </section>
        <section class="doc-sec" id="doc-chords"><h2>Akkorde</h2>
          <p>Ein <b>Akkord</b> sind mehrere Töne gleichzeitig. Im Notensystem stehen sie <b>übereinander</b>. Ein <b>Dreiklang</b> besteht aus drei Tönen im Abstand einer „Terz“, also Linie-Linie-Linie oder Raum-Raum-Raum.</p>
          ${fig('treble', 'C', [{ notes: [N(28), N(30), N(32)], dur: 1, chordItem: true, label: 'C-Dur' }, { notes: [N(28), N(30, -1), N(32)], dur: 1, chordItem: true, label: 'C-Moll' }, { notes: [N(30), N(32), N(35)], dur: 1, chordItem: true, label: 'C-Dur, 1. Umkehrung' }], 'Dur klingt hell (große Terz unten), Moll klingt dunkel (kleine Terz unten). Bei Umkehrungen wandert der unterste Ton nach oben.', 520)}
          <p>Im <b>Akkordtrainer</b> spielst du jeden Ton einzeln – die Reihenfolge ist egal, bis der Akkord komplett ist.</p>
        </section>
        <section class="doc-sec" id="doc-tips"><h2>Merkhilfen</h2>
          <div class="callout"><b>Orientierungsnoten:</b> Lerne erst wenige Töne sicher – das <b>mittlere C</b>, das <b>g′</b> auf der 2. Linie im Violinschlüssel und das <b>f</b> auf der 4. Linie im Bassschlüssel. Alle anderen liest du als Schritte von dort.</div>
          <div class="callout"><b>Linien-Merksprüche</b> helfen beim Anfang, z. B. für die Linien im Violinschlüssel (E G ${H} D F): „Es geht hurtig durch Fahrten“ – denk dir einen eigenen aus!</div>
          <div class="callout"><b>Schritt oder Sprung?</b> Wandert die Melodie von Linie zu Zwischenraum, ist es ein Schritt (Nachbartaste). Von Linie zu Linie ist es ein Sprung über eine Taste.</div>
          <div class="row"><button class="btn primary" data-go="home">${icon('play', 16)} Jetzt üben</button></div>
        </section>
      </div>
    </div>`;
}

   Statistik (SVG-Diagramme, Tooltips, Tabellenansicht)

let statTab = 'all';
const MODE_SHORT = { learn: 'Lernen', speedrun: 'Speedrun', songs: 'Lieder', chords: 'Akkorde' };
const MODE_COLOR = { learn: 'f-s1', songs: 'f-s2', speedrun: 'f-s3', chords: 'f-s4' };
const MODE_VAR = { learn: 'var(--s1)', songs: 'var(--s2)', speedrun: 'var(--s3)', chords: 'var(--s4)' };
const DAYN = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
const fmtDur = s => { const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60); return h ? h + ' h ' + m + ' min' : m ? m + ' min' : s + ' s'; };
const niceMax = v => { if (v <= 5) return 5; const p = Math.pow(10, Math.floor(Math.log10(v))), n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; };
const topRound = (x, y, w, h, r) => { r = Math.max(0, Math.min(r, h, w / 2)); return `M${x} ${y + h}V${y + r}Q${x} ${y} ${x + r} ${y}H${x + w - r}Q${x + w} ${y} ${x + w} ${y + r}V${y + h}Z`; };
const rightRound = (x, y, w, h, r) => { r = Math.max(0, Math.min(r, h / 2, w)); return `M${x} ${y}H${x + w - r}Q${x + w} ${y} ${x + w} ${y + r}V${y + h - r}Q${x + w} ${y + h} ${x + w - r} ${y + h}H${x}Z`; };
const chartBox = (w, h, inner, label) => `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(label)}">${inner}</svg>`;
function yGrid(max, ticks, L, R, T, B, f = v => v) {
  let o = ''; for (let i = 0; i <= ticks; i++) { const y = B - (B - T) * i / ticks; o += `<line class="grid" x1="${L}" x2="${R}" y1="${y}" y2="${y}"/><text x="${L - 6}" y="${y + 4}" text-anchor="end">${f(Math.round(max * i / ticks * 10) / 10)}</text>`; }
  return o;
}
const emptyBox = t => `<div class="empty">${t}</div>`;
const panel = (cls, title, sub, body) => `<div class="panel card ${cls}"><h3>${title}</h3><p class="sub">${sub}</p>${body}</div>`;
const legendHTML = items => `<div class="legend">${items.map(([c, t]) => `<span><i style="background:${c}"></i>${t}</span>`).join('')}</div>`;
const tableView = (head, rows) => `<details class="tbl"><summary>Daten als Tabelle</summary><div class="tbl-wrap"><table><thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details>`;
const kpi = (k, v, d) => `<div class="kpi card"><div class="k">${k}</div><div class="v">${v}</div><div class="d">${d || '&nbsp;'}</div></div>`;

/* Senkrechte Balken (optional mit Referenzlinie) */
function vBars(items, o = {}) {
  const W = o.w || 600, H = o.h || 200, L = 40, R = 8, T = 14, B = o.labels ? 28 : 12, pw = W - L - R, n = items.length, bw = pw / n;
  const max = o.max || niceMax(Math.max(...items.map(i => i.v), o.ref || 0, 1)), sy = v => (H - B - T) * Math.min(v, max) / max;
  let s = yGrid(max, 4, L, W - R, T, H - B, o.f);
  items.forEach((it, i) => {
    const w = Math.min(bw * .64, 44), x = L + i * bw + (bw - w) / 2, h = sy(it.v);
    if (it.v > 0) s += `<path class="${o.cls || 'f-a'}" d="${topRound(x, H - B - h, w, Math.max(h, 2), 4)}"/>`; else s += `<rect class="f-m" x="${x}" y="${H - B - 2}" width="${w}" height="2"/>`;
    if (o.values && n <= 12 && it.v > 0) s += `<text x="${x + w / 2}" y="${H - B - h - 5}" text-anchor="middle" style="fill:var(--ink)">${o.f ? o.f(it.v) : it.v}</text>`;
    if (o.labels && it.label && (n <= 14 || i % 2 === 0)) s += `<text x="${x + w / 2}" y="${H - 8}" text-anchor="middle">${esc(it.label)}</text>`;
    s += `<rect class="col" x="${L + i * bw}" y="${T}" width="${bw}" height="${H - B - T}" data-tip="${esc(it.tip)}"/>`;
  });
  if (o.ref) s += `<line class="ref" x1="${L}" x2="${W - R}" y1="${H - B - sy(o.ref)}" y2="${H - B - sy(o.ref)}"/><text x="${W - R}" y="${H - B - sy(o.ref) - 5}" text-anchor="end" style="fill:var(--ink)">${o.refLabel}</text>`;
  return chartBox(W, H, s, o.title);
}
/* Liniendiagramm */
function lineChart(pts, o) {
  const W = 600, H = 200, L = 40, R = 10, T = 12, B = 26, pw = W - L - R, n = pts.length;
  if (n < 2) return emptyBox('Spiele mindestens zwei Runden – dann erscheint hier der Verlauf.');
  const x = i => L + pw * i / (n - 1), y = v => H - B - (H - B - T) * Math.min(v, o.max) / o.max;
  const d = pts.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1)).join('');
  let s = yGrid(o.max, 4, L, W - R, T, H - B, o.f) + `<path class="area" d="${d}L${x(n - 1)} ${H - B}L${L} ${H - B}Z"/><path class="l-a" d="${d}"/>`;
  if (n <= 24) pts.forEach((p, i) => { s += `<circle class="dot" cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="4"/>`; });
  pts.forEach((p, i) => { s += `<circle class="col" cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="13" data-tip="${esc(p.tip)}"/>`; });
  s += `<text x="${L}" y="${H - 6}">älter</text><text x="${W - R}" y="${H - 6}" text-anchor="end">zuletzt</text>`;
  return chartBox(W, H, s, o.title);
}
const accPts = hist => hist.filter(h => h.c + h.w > 0).map(h => { const a = Math.round(100 * h.c / (h.c + h.w)); return { v: a, tip: new Date(h.t).toLocaleDateString('de-DE') + ' · ' + MODE_SHORT[h.m] + ': ' + a + ' % (' + h.c + ' von ' + (h.c + h.w) + ')' }; });

function chartDaily() {
  const n = innerWidth < 640 ? 10 : 14, W = 600, H = 220, L = 40, R = 8, T = 12, B = 28, bw = (W - L - R) / n, days = [];
  for (let i = n - 1; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); const v = S.days[dayKey(d)] || [0, 0, 0]; days.push({ d, c: v[0], w: v[1] }); }
  if (!days.some(x => x.c + x.w)) return { svg: emptyBox('In den letzten Tagen noch nichts geübt.'), rows: [] };
  const max = niceMax(Math.max(...days.map(x => x.c + x.w))), sy = v => (H - B - T) * v / max;
  let s = yGrid(max, 4, L, W - R, T, H - B);
  days.forEach((x, i) => {
    const w = bw * .62, cx = L + i * bw + (bw - w) / 2, hc = sy(x.c), hw = sy(x.w), yc = H - B - hc;
    if (x.c) s += x.w ? `<rect class="f-ok" x="${cx}" y="${yc}" width="${w}" height="${hc}"/>` : `<path class="f-ok" d="${topRound(cx, yc, w, hc, 4)}"/>`;
    if (x.w) s += `<path class="f-bad" d="${topRound(cx, yc - hw - (x.c ? 2 : 0), w, hw, 4)}"/>`;
    if (!x.c && !x.w) s += `<rect class="f-m" x="${cx}" y="${H - B - 2}" width="${w}" height="2"/>`;
    if ((n - 1 - i) % 2 === 0) s += `<text x="${cx + w / 2}" y="${H - 8}" text-anchor="middle">${x.d.getDate()}.</text>`;
    s += `<rect class="col" x="${L + i * bw}" y="${T}" width="${bw}" height="${H - B - T}" data-tip="${DAYN[x.d.getDay()]}, ${x.d.getDate()}.${x.d.getMonth() + 1}.: ${x.c} richtig, ${x.w} falsch"/>`;
  });
  return { svg: chartBox(W, H, s, 'Richtige und falsche Antworten pro Tag'), rows: days.map(x => [x.d.toLocaleDateString('de-DE'), x.c, x.w]) };
}
function chartDonut(c, w) {
  const tot = c + w; if (!tot) return emptyBox('Noch keine Noten gespielt.');
  const R = 62, C = 2 * Math.PI * R, p = c / tot, gap = c && w ? 3 : 0, lc = Math.max(0, C * p - gap), lw = Math.max(0, C * (1 - p) - gap);
  let s = '';
  if (c) s += `<circle class="rg rg-ok" cx="100" cy="100" r="${R}" transform="rotate(-90 100 100)" stroke-dasharray="${lc} ${C - lc}" data-tip="Richtig: ${fmt(c)}"/>`;
  if (w) s += `<circle class="rg rg-bad" cx="100" cy="100" r="${R}" transform="rotate(-90 100 100)" stroke-dasharray="${lw} ${C - lw}" stroke-dashoffset="${-(C * p)}" data-tip="Falsch: ${fmt(w)}"/>`;
  s += `<text class="big" x="100" y="106" text-anchor="middle">${Math.round(p * 100)} %</text><text x="100" y="126" text-anchor="middle">Erfolgsquote</text>`;
  return `<div style="max-width:230px;margin:0 auto">${chartBox(200, 200, s, 'Erfolgsquote ' + Math.round(p * 100) + ' Prozent')}</div>` + legendHTML([['var(--ok)', 'Richtig ' + fmt(c)], ['var(--bad)', 'Falsch ' + fmt(w)]]);
}
function chartModes() {
  const rows = MODE_IDS.map(m => ({ m, n: S.modes[m].c + S.modes[m].w })), max = Math.max(...rows.map(r => r.n), 1);
  if (!rows.some(r => r.n)) return emptyBox('Noch keine Daten.');
  const W = 600, L = 96, rh = 40; let s = '';
  rows.forEach((r, i) => {
    const y = i * rh + 6, w = Math.max(3, (W - L - 70) * r.n / max);
    s += `<text x="${L - 12}" y="${y + 17}" text-anchor="end" style="fill:var(--ink)">${MODE_SHORT[r.m]}</text><path class="${MODE_COLOR[r.m]}" d="${rightRound(L, y, w, 26, 5)}"/><text x="${L + w + 8}" y="${y + 17}" style="fill:var(--ink)">${fmt(r.n)}</text><rect class="col" x="0" y="${y - 4}" width="${W}" height="${rh - 4}" data-tip="${MODE_SHORT[r.m]}: ${fmt(r.n)} Noten (${S.modes[r.m].rounds} Runden)"/>`;
  });
  return chartBox(W, rows.length * rh + 6, s, 'Gespielte Noten pro Spielmodus');
}
function chartWeekday() {
  const sums = [0, 0, 0, 0, 0, 0, 0]; for (const k in S.days) { const wd = (new Date(k + 'T12:00').getDay() + 6) % 7; sums[wd] += S.days[k][0] + S.days[k][1]; }
  if (!sums.some(Boolean)) return emptyBox('Noch keine Daten.');
  const nm = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
  return vBars(nm.map((l, i) => ({ v: sums[i], label: l, tip: ['Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag', 'Sonntag'][i] + ': ' + fmt(sums[i]) + ' Noten' })), { labels: true, values: true, title: 'Noten nach Wochentag' });
}
function letterStats() {
  const a = {}; LETTERS.forEach(l => a[l] = [0, 0]);
  for (const k in S.weak) { const L = LETTERS[letterIdx(Number(k.slice(1)))]; a[L][0] += S.weak[k][0]; a[L][1] += S.weak[k][1]; }
  return a;
}
function chartLetters() {
  const a = letterStats(); if (!LETTERS.some(l => a[l][0] + a[l][1])) return emptyBox('Noch keine Daten.');
  const nm = l => S.settings.naming === 'en' ? l : (l === 'B' ? 'H' : l);
  return vBars(LETTERS.map(l => { const n = a[l][0] + a[l][1], p = n ? Math.round(100 * a[l][0] / n) : 0; return { v: p, label: nm(l), tip: nm(l) + ': ' + (n ? p + ' % richtig (' + a[l][0] + ' von ' + n + ')' : 'noch nicht gespielt') }; }), { w: 1000, max: 100, f: v => v + ' %', labels: true, values: true, title: 'Trefferquote je Notenname' });
}
function chartHeat() {
  const rows = [['t', 'Violin'], ['b', 'Bass']].map(([cl, nm]) => ({ cl, nm, steps: Object.keys(S.weak).filter(k => k[0] === cl).map(k => ({ step: Number(k.slice(1)), c: S.weak[k][0], w: S.weak[k][1] })).sort((p, q) => p.step - q.step) })).filter(r => r.steps.length);
  if (!rows.length) return emptyBox('Sobald du ein paar Noten gespielt hast, siehst du hier deine Problemstellen.');
  const W = 900, L = 64, mx = Math.max(...rows.map(r => r.steps.length)), cw = Math.min(48, (W - L - 8) / mx), ch = 46; let s = '';
  rows.forEach((r, ri) => {
    const y = ri * (ch + 14) + 4; s += `<text x="${L - 10}" y="${y + ch / 2 + 4}" text-anchor="end" style="fill:var(--ink)">${r.nm}</text>`;
    r.steps.forEach((st, i) => {
      const n = st.c + st.w, err = st.w / n, x = L + i * cw, nm = noteName({ step: st.step, acc: 0 }, 'C', S.settings.naming) + octOf(st.step);
      s += `<rect class="hm" x="${x + 1.5}" y="${y}" width="${cw - 3}" height="${ch}" rx="5" style="fill-opacity:${(.1 + .9 * err).toFixed(2)}"/><text x="${x + cw / 2}" y="${y + ch / 2 + 4}" text-anchor="middle" style="fill:${err > .5 ? 'var(--accent-ink)' : 'var(--ink)'};font-size:10px">${nm}</text><rect class="col" x="${x}" y="${y}" width="${cw}" height="${ch}" data-tip="${r.nm} · ${nm}: ${st.w} von ${n} falsch (${Math.round(100 * err)} %)"/>`;
    });
  });
  return chartBox(W, rows.length * (ch + 14) + 6, s, 'Fehlerquote je Notenposition') + `<div class="legend"><span>weniger Fehler</span>${[.1, .3, .55, .8, 1].map(o => `<i style="background:var(--accent);opacity:${o}"></i>`).join('')}<span>mehr Fehler</span></div>`;
}

function statsAll() {
  const tot = S.totalCorrect + S.totalWrong, rounds = MODE_IDS.reduce((a, m) => a + S.modes[m].rounds, 0), ms = MODE_IDS.reduce((a, m) => a + S.modes[m].ms, 0), mn = MODE_IDS.reduce((a, m) => a + S.modes[m].n, 0);
  const daily = chartDaily(), hist = S.hist.slice(-40), rt = hist.filter(h => h.ms > 0).map(h => ({ v: Math.round(h.ms / 100) / 10, tip: new Date(h.t).toLocaleDateString('de-DE') + ' · ' + MODE_SHORT[h.m] + ': Ø ' + (h.ms / 1000).toFixed(1) + ' s pro Note' }));
  const rtMax = Math.max(2, Math.ceil(Math.max(...rt.map(p => p.v), 0)));
  return `<div class="kpis">${kpi('Noten gespielt', fmt(tot), fmt(S.totalCorrect) + ' richtig')}${kpi('Erfolgsquote', tot ? Math.round(100 * S.totalCorrect / tot) + ' %' : '–', fmt(S.totalWrong) + ' Fehler')}${kpi('Übungszeit', fmtDur(totalTime()), rounds + ' Runden')}${kpi('Beste Serie', S.bestStreak, 'Tage in Folge: ' + S.streakDays.best)}${kpi('Ø Reaktionszeit', mn ? (ms / mn / 1000).toFixed(1) + ' s' : '–', 'pro richtiger Note')}${kpi('Gesamt-XP', fmt(S.xp), 'Level ' + curLevel())}</div>
  <div class="dash" style="margin-top:14px">
    ${panel('s8', 'Aktivität', 'Antworten pro Tag, letzte ' + (innerWidth < 640 ? 10 : 14) + ' Tage', daily.svg + (daily.rows.length ? legendHTML([['var(--ok)', 'Richtig'], ['var(--bad)', 'Falsch']]) + tableView(['Tag', 'Richtig', 'Falsch'], daily.rows) : ''))}
    ${panel('s4', 'Gesamtquote', 'Alle Antworten seit Beginn', chartDonut(S.totalCorrect, S.totalWrong))}
    ${panel('s6', 'Genauigkeit pro Runde', 'Anteil richtiger Antworten, letzte Runden', lineChart(accPts(hist), { max: 100, f: v => v + ' %', title: 'Genauigkeit pro Runde' }))}
    ${panel('s6', 'Reaktionszeit', 'Durchschnittliche Sekunden pro Note – niedriger ist besser', lineChart(rt, { max: rtMax, f: v => v + ' s', title: 'Reaktionszeit pro Runde' }))}
    ${panel('s6', 'Spielmodi', 'Gespielte Noten je Modus', chartModes())}
    ${panel('s6', 'Wann übst du?', 'Noten nach Wochentag', chartWeekday())}
    ${panel('s12', 'Trefferquote je Notenname', 'Welche Töne sitzen, welche nicht?', chartLetters())}
    ${panel('s12', 'Problemstellen im Notensystem', 'Jede Kachel ist eine Notenposition – je dunkler, desto mehr Fehler. Bewege die Maus (oder tippe) für Details.', chartHeat())}
  </div>`;
}
function statsMode(m) {
  const ms = S.modes[m], tot = ms.c + ms.w;
  if (!ms.rounds && !tot) return emptyBox('Für diesen Modus gibt es noch keine Daten – spiel eine Runde!');
  const hist = S.hist.filter(h => h.m === m).slice(-30), bestLbl = { learn: 'Beste Serie', speedrun: 'Rekord (Treffer)', chords: 'Bestwert (Punkte)', songs: 'Beste Genauigkeit' }[m];
  const bestVal = m === 'learn' ? S.high.learn : m === 'speedrun' ? S.high.speedrun : m === 'chords' ? S.high.chords : ms.best + ' %';
  const bars = hist.map((h, i) => ({ v: h.c, label: '#' + (i + 1), tip: new Date(h.t).toLocaleDateString('de-DE') + ': ' + h.c + ' Treffer, ' + h.w + ' Fehler' }));
  let extra = '';
  if (m === 'songs') extra = panel('s12', 'Deine Lieder', 'Beste Wertung je Stufe', `<div class="tbl-wrap"><table><thead><tr><th>Lied</th>${SONG_LEVELS.map(l => `<th>${l.name}</th>`).join('')}</tr></thead><tbody>${SONGS.map(s => `<tr><td>${esc(s.title)}</td>${SONG_LEVELS.map(l => { const b = S.high.songs[s.id + '_' + l.id]; return `<td class="stars">${b ? '★'.repeat(b.stars) + '<span class="off">' + '★'.repeat(3 - b.stars) + '</span>' : '<span class="off">–</span>'}</td>`; }).join('')}</tr>`).join('')}</tbody></table></div>`);
  return `<div class="kpis">${kpi('Runden', ms.rounds)}${kpi('Treffer', fmt(ms.c), fmt(ms.w) + ' Fehler')}${kpi('Genauigkeit', tot ? Math.round(100 * ms.c / tot) + ' %' : '–')}${kpi('Ø Reaktionszeit', ms.n ? (ms.ms / ms.n / 1000).toFixed(1) + ' s' : '–', 'pro richtiger Note')}${kpi('Spielzeit', fmtDur(ms.time))}${kpi(bestLbl, bestVal)}</div>
  <div class="dash" style="margin-top:14px">
    ${panel('s6', 'Genauigkeit pro Runde', MODE_SHORT[m] + ' – letzte Runden', lineChart(accPts(hist), { max: 100, f: v => v + ' %', title: 'Genauigkeit pro Runde' }))}
    ${panel('s6', 'Treffer pro Runde', m === 'speedrun' ? 'Mit deinem Rekord als Linie' : 'Richtige Antworten je Runde', hist.length ? vBars(bars, { cls: MODE_COLOR[m], labels: true, values: true, ref: m === 'speedrun' ? S.high.speedrun : 0, refLabel: 'Rekord ' + S.high.speedrun, title: 'Treffer pro Runde' }) + tableView(['Runde', 'Treffer', 'Fehler'], hist.map((h, i) => [i + 1, h.c, h.w])) : emptyBox('Noch keine abgeschlossenen Runden.'))}
    ${extra}
  </div>`;
}
function renderStats() {
  $('#view-stats').innerHTML = `<div class="page-head"><div><h2>Statistik</h2><span class="sub">Wie sicher du Noten liest – und woran du noch arbeiten kannst.</span></div></div>
    <div class="seg" id="stab">${[['all', 'Gesamt']].concat(MODE_IDS.map(m => [m, MODE_SHORT[m]])).map(([id, l]) => `<button data-stab="${id}" aria-pressed="${statTab === id}">${l}</button>`).join('')}</div>
    <div style="height:14px"></div>${statTab === 'all' ? statsAll() : statsMode(statTab)}`;

$('#view-stats').addEventListener('click', e => { const b = e.target.closest('[data-stab]'); if (b) { statTab = b.dataset.stab; renderStats(); } });

/* Tooltip für Diagramme */
const tipEl = document.createElement('div'); tipEl.className = 'tip'; document.body.appendChild(tipEl);
function tipMove(e) {
  const t = e.target.closest && e.target.closest('[data-tip]'); if (!t) { tipEl.classList.remove('on'); return; }
  tipEl.textContent = t.dataset.tip; tipEl.classList.add('on'); const r = tipEl.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY - r.height - 12; if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14; if (x < 8) x = 8; if (y < 8) y = e.clientY + 18;

}
document.addEventListener('pointermove', tipMove); document.addEventListener('pointerdown', tipMove);
addEventListener('scroll', () => tipEl.classList.remove('on'), { passive: true });

/* ---------------------------------------------------------------
   Dialoge
   --------------------------------------------------------------- */
function infoNoCloud() {

  openModal(`<h2>${esc(u.displayName || 'Konto')}</h2><p class="sub">${esc(u.email || '')}</p><p class="hint-txt" id="sync-state">${syncHTML()}</p>
    <div class="row"><button class="btn" data-go="profile">${icon('user', 16)} Profil &amp; Einstellungen</button><button class="btn danger" data-act="logout">${icon('logout', 16)} Abmelden</button></div>`);

/* ---------------------------------------------------------------

   --------------------------------------------------------------- */
const ACT = {
  home() { closeModal(); if (G && !G.over) { G.over = true; cancelAnimationFrame(raf); } G = null; show('home'); },
  mode(el) {

  },
  confirmQuit() { closeModal(); if (G) endGame(); },
  resumeClose() { closeModal(); setPause(false); },
  pause() { if (G && !G.over) setPause(!G.paused); },
  resume() { setPause(false); },

  theme() { toggleTheme(); if (curView === 'profile') renderProfile(); },
  login() { closeModal(); Cloud.login(); },
  logout() { closeModal(); Cloud.logout(); },
  account() { accountModal(); },
  closeModal() { closeModal(); },
  reset() { openModal(`<h2>Fortschritt löschen?</h2><p class="sub">XP, Statistik und Erfolge werden zurückgesetzt${Cloud.user ? ' – auch in der Cloud' : ''}. Einstellungen bleiben. Das lässt sich nicht rückgängig machen.</p><div class="row"><button class="btn danger" data-act="confirmReset">Ja, alles löschen</button><button class="btn" data-act="closeModal">Abbrechen</button></div>`); },
  confirmReset() { const s = S.settings; S = DEFAULTS(); S.settings = s; sanitize(); save(); closeModal(); renderAll(); toast({ title: 'Zurückgesetzt', text: 'Du startest wieder bei Level 1.', ic: 'check' }); }
};
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g) { e.preventDefault(); go(g.dataset.go); return; }
  const a = e.target.closest('[data-act]'); if (a && ACT[a.dataset.act]) ACT[a.dataset.act](a, e);

document.addEventListener('pointerdown', () => Snd.init(), { once: true });
$('#btn-quit').innerHTML = icon('x', 16) + ' Beenden';

$$('.ni[data-ic]').forEach(n => { n.innerHTML = icon(n.dataset.ic, 18); });

{ const h = location.hash.replace('#/', ''); show(['home', 'stats', 'ach', 'learn', 'profile'].includes(h) ? h : 'home'); }
addEventListener('load', moveInd); if (document.fonts && document.fonts.ready) document.fonts.ready.then(moveInd);
Cloud.init();
})();
